<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Aliade 3D</title><style>*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000;font-family:Arial;touch-action:none}#ui{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:8px;z-index:10}#ui div{background:#000c;color:#fff;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:13px}#joy{position:fixed;bottom:20px;left:20px;width:110px;height:110px;background:#fff3;border-radius:50%;border:2px solid #fff;z-index:10}#stick{position:absolute;left:30px;top:30px;width:50px;height:50px;background:#000a;border-radius:50%}#btns{position:fixed;bottom:20px;right:15px;display:flex;flex-direction:column;gap:10px;z-index:10}.b{width:90px;height:48px;border:0;border-radius:12px;color:#fff;font-weight:bold;font-size:14px}#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;color:#fff;padding:14px 20px;border-radius:12px;display:none;z-index:11}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><div id="ui"><div>💰$<span id="m">50</span></div><div>❤️<span id="h">100</span></div><div>⏰<span id="t">6AM</span></div></div><div id="joy"><div id="stick"></div></div><div id="btns"><button class="b" id="wb" style="background:#FF5722">WORK</button><button class="b" id="eb" style="background:#4CAF50">EAT</button></div><div id="msg"></div><script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);
let camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,0.1,1000);
let renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.2));let dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(10,20,10);dl.castShadow=true;scene.add(dl);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x6BBE66}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
function building(x,z,w,d,c,name){let m=new THREE.Mesh(new THREE.BoxGeometry(w,12,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,6,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);let canvas=document.createElement('canvas');canvas.width=256;canvas.height=64;let ct=canvas.getContext('2d');ct.fillStyle='#000a';ct.fillRect(0,0,256,64);ct.fillStyle='#fff';ct.font='bold 20px Arial';ct.fillText(name,10,40);let tex=new THREE.CanvasTexture(canvas);let spr=new THREE.Sprite(new THREE.SpriteMaterial({map:tex}));spr.position.set(x,18,z);spr.scale.set(30,8,1);scene.add(spr);return {x,z,w,d,name:m.name=name,mesh:m};}
let blds=[building(-20, -15, 20,14, 0x8D6E63,'MAMA PUT - WORK'), building(35, -10, 18,18, 0x5D4037,'HOUSE'), building(-25, 30, 16,16, 0x4CAF50,'MARKET')];
let player=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(1,2,4,8),new THREE.MeshStandardMaterial({color:0x2196F3}));body.position.y=2;player.add(body);player.position.set(0,0,0);scene.add(player);
let pl={x:0,z:0,m:50,h:100};let cam={x:0,z:20};let joy={x:0,y:0,a:0};let J=document.getElementById('joy'),S=document.getElementById('stick');
function MSG(t){let M=document.getElementById('msg');M.innerText=t;M.style.display='block';setTimeout(()=>M.style.display='none',2000)}
function HJ(e){let r=J.getBoundingClientRect(),cx=r.left+55,cy=r.top+55;let X=(e.touches?e.touches[0].clientX:e.clientX)-cx,Y=(e.touches?e.touches[0].clientY:e.clientY)-cy;let d=Math.hypot(X,Y),lim=35;if(d>lim){X=X/d*lim;Y=Y/d*lim}S.style.transform=`translate(${X}px,${Y}px)`;joy.x=X/lim;joy.y=Y/lim}
J.addEventListener('touchstart',e=>{joy.a=1;HJ(e)});J.addEventListener('touchmove',e=>{if(joy.a)HJ(e);e.preventDefault()},{passive:false});addEventListener('touchend',()=>{joy.a=0;joy.x=0;joy.y=0;S.style.transform='translate(0,0)'});
function WORK(){for(let b of blds){if(Math.hypot(pl.x-b.x,pl.z-b.z)<20&&b.name.includes('WORK')){pl.m+=20;MSG('Worked! +$20');return}}MSG('Go to MAMA PUT to work!')}function EAT(){if(pl.m>=10){pl.m-=10;pl.h=Math.min(100,pl.h+20);MSG('Ate! +20 health')}else MSG('Need $10!')}document.getElementById('wb').onclick=WORK;document.getElementById('eb').onclick=EAT;
let tm=360;function animate(){requestAnimationFrame(animate);pl.x+=joy.x*0.3;pl.z+=joy.y*0.3;player.position.x=pl.x;player.position.z=pl.z;if(joy.x||joy.y)player.rotation.y=Math.atan2(joy.x,joy.y);cam.x+=(pl.x-cam.x)*0.05;cam.z+=(pl.z+20-cam.z)*0.05;camera.position.set(cam.x,15,cam.z);camera.lookAt(pl.x,2,pl.z);tm+=0.3;document.getElementById('m').innerText=pl.m;document.getElementById('h').innerText=Math.floor(pl.h);let hr=Math.floor(tm/60)%24,mn=Math.floor(tm%60);document.getElementById('t').innerText=`${hr%12||12}:${String(mn).padStart(2,'0')}${hr>=12?'PM':'AM'}`;renderer.render(scene,camera)}animate();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};MSG('3D Aliade Loaded! Move joystick');
</script></body></html>
