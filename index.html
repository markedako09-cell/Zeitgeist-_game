<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAGOS V4 NPC FIX</title><style>
body{margin:0;font-family:Arial;background:#050510;color:#fff}
#ui{padding:8px 10px;display:flex;justify-content:space-between;background:#111;font-size:13px}
#street{position:relative;width:100%;height:220px;background:linear-gradient(to bottom,#22346a,#050510);border-bottom:2px solid #333;overflow:hidden;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:10px}
.npcBox{text-align:center;background:#0008;padding:6px;border-radius:10px;border:1px solid #333}
.npcBox b{font-size:28px;display:block}
#lists{margin:8px 10px;background:#111;padding:8px;border-radius:10px;font-size:12px}
#actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px}
button{border:0;padding:11px;border-radius:12px;font-weight:bold;color:#fff;font-size:11px}
.p{background:#7c5cff}.y{background:#ffb700;color:#000}.pi{background:#ff3b9a}.g{background:#00c06a}.d{background:#222}.b{background:#2196F3}.r{background:#ff3b3b}
#log{position:fixed;bottom:20px;left:10px;right:10px;background:#000f;padding:10px;border-radius:12px;text-align:center;display:none;z-index:99}
</style></head><body>
<div id="ui"><div>💰 $<span id="m">1100</span> 🏦 $<span id="bk">0</span><br>🏠 Lv<span id="lv">0</span> 🚗 <span id="cr">0</span> 👶 <span id="kd">0</span></div><div>📍 Oshodi<br>💍 <span id="mar">Single</span> ⚡ <span id="en">100%</span></div></div>

<div id="street"></div>

<div id="lists">
<div><b>👥 ONLINE PLAYERS (LIVE):</b><br><span id="plist" style="color:#0f0">🟢 Damilola_Oshodi | 🟢 Blessing_Lekki | 🟢 Wizzy_VI | 🟢 Tobi_Banana | 🟢 Emeka_Computer</span></div>
<div style="margin-top:6px"><b>🧍 NPCs ON STREET - TAP TO TALK:</b><br><span id="nlist">🔪 Agbero | 🍲 Mama Put | 👮 Police | 💃 Amaka | 👨‍💻 Yahoo Kay | 🚌 Danfo</span></div>
</div>

<div id="actions">
<button class="p" onclick="work()">🚌 WORK</button><button class="b" onclick="yahoo()">💻 YAHOO</button><button class="p" onclick="build()">🏗️ BUILD</button>
<button class="p" onclick="car()">🚘 CAR</button><button class="y" onclick="bank()">🏦 BANK</button><button class="r" onclick="doAgbero()">🔪 AGBERO</button>
<button class="pi" onclick="marry()">💍 MARRY 30M</button><button class="g" onclick="sleep()">🛏️ SLEEP</button><button class="d" onclick="pos()">🏧 POS</button>
</div>
<div id="log"></div>

<script>
let money=1100,bank=0,lv=0,cars=0,kids=0,en=100,married=false,hasPOS=false,hasPap=false;
function show(t){let l=document.getElementById('log');l.innerText=t;l.style.display='block';setTimeout(()=>l.style.display='none',3000)}
function upd(){document.getElementById('m').innerText=money;document.getElementById('bk').innerText=bank;document.getElementById('lv').innerText=lv;document.getElementById('cr').innerText=cars;document.getElementById('kd').innerText=kids;document.getElementById('en').innerText=en+'%';document.getElementById('mar').innerText=married?'Married':'Single'}

function buildStreet(){
 let s=document.getElementById('street');
 s.innerHTML=`
 <div class="npcBox" onclick="doAgbero()"><b>🔪</b>Agbero<br><small>Tunde</small></div>
 <div class="npcBox" onclick="eat()"><b>🍲</b>Mama Put<br><small>$20 food</small></div>
 <div class="npcBox" onclick="checkPolice()"><b>👮</b>Police<br><small>Musa</small></div>
 <div class="npcBox" onclick="marry()"><b>💃</b>Amaka<br><small>Marry me</small></div>
 <div class="npcBox" onclick="yahoo()"><b>👨‍💻</b>Yahoo<br><small>Kay</small></div>
 <div class="npcBox" onclick="work()"><b>🚌</b>Danfo<br><small>Driver</small></div>
 `;
 // players walking emoji on top
 let walk=document.createElement('div');
 walk.style.position='absolute';walk.style.top='10px';walk.style.left='0';walk.style.width='100%';walk.style.fontSize='20px';walk.innerHTML='<marquee>🧑 Damilola 🏃‍♀️ Blessing 🚶 Wizzy 🧍‍♂️ Tobi 👨‍🦱 Emeka — ONLINE IN LAGOS</marquee>';
 s.appendChild(walk);
}
function work(){if(en<=0)return show('No energy! Sleep!');money+=married?300:150;en-=5;show('Danfo +$'+(married?300:150));upd()}
function yahoo(){if(Math.random()<0.3){money-=500;show('🚔 EFCC CATCH! -$500')}else{money+=800;show('Yahoo +$800')}en-=10;upd()}
function build(){let c=Math.floor(1000*Math.pow(2.2,lv));if(money>=c&&lv<5){money-=c;lv++;show('Built Lv'+lv)}else show('Need $'+c);upd()}
function car(){let c=Math.floor(2000*Math.pow(1.8,cars));if(money>=c){money-=c;cars++;show('Car bought')}else show('Need $'+c);upd()}
function doAgbero(){if(money>=50){money-=50;show('Paid Agbero $50 - you safe')}else show('Agbero go beat you!');upd()}
function eat(){if(money>=20){money-=20;en=100;show('Ate Jollof! Energy 100%')}else show('No money for food');upd()}
function checkPolice(){if(cars>0&&!hasPap){money-=300;cars=Math.max(0,cars-1);show('Police seize car! -$300 Buy papers!')}else show('Police: You clean');upd()}
function bank(){let a=prompt('Deposit?');a=parseInt(a);if(a>0&&money>=a){money-=a;bank+=a;show('Bank $'+a)}upd()}
function marry(){if(!married){married=true;money+=30000000;kids=1;show('💍 Married Amaka! +$30M +1 kid!')}else show('Already married');upd()}
function sleep(){if(!married)return show('Marry first!');if(lv==0)return show('Need house!');en=100;money+=1000;if(Math.random()<0.4){kids++;show('👶 Baby born! +$1k')}else show('Slept together +$1k Energy 100%');upd()}
function pos(){if(hasPOS)return show('POS running');if(money>=1000){money-=1000;hasPOS=true;show('POS +$80/10s');setInterval(()=>{if(hasPOS){money+=80;upd()}},10000)}else show('Need $1k');upd()}

buildStreet();upd();
setInterval(()=>{if(bank>0){let i=Math.floor(bank*0.15);bank+=i;show('Bank interest +$'+i);upd()}},30000);
</script></body></html>
