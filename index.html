<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aliade Game</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#6BBE66;overflow:hidden;font-family:Arial}canvas{position:fixed;inset:0;width:100%;height:100%}#ui{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:8px;z-index:9}#ui div{background:#000c;color:#fff;padding:5px 9px;border-radius:12px;font-size:12px;font-weight:bold}#joy{position:fixed;bottom:15px;left:15px;width:100px;height:100px;background:#ffffff55;border-radius:50%;border:2px solid #fff;z-index:9}#stick{position:absolute;left:25px;top:25px;width:50px;height:50px;background:#000a;border-radius:50%}#btns{position:fixed;bottom:15px;right:10px;display:flex;flex-direction:column;gap:8px;z-index:9}.b{width:80px;height:42px;border:0;border-radius:10px;color:#fff;font-weight:bold;background:#FF5722}#msg{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000d;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:10}</style></head><body><div id="ui"><div>💰$<span id="m">50</span></div><div>❤️<span id="h">100</span></div><div>⏰<span id="t">6AM</span></div></div><canvas id="c"></canvas><div id="joy"><div id="stick"></div></div><div id="btns"><button class="b" id="wb">WORK</button><button class="b" id="eb" style="background:#4CAF50">EAT</button></div><div id="msg"></div><script>
cv=document.getElementById('c');ctx=cv.getContext('2d');function RS(){cv.width=innerWidth;cv.height=innerHeight}RS();onresize=RS;
pl={x:0,y:0,m:50,h:100};blds=[{x:-200,y:-200,w:280,h:180,c:'#8D6E63',n:'MAMA PUT - WORK'},{x:350,y:-80,w:220,h:220,c:'#5D4037',n:'HOUSE'},{x:-280,y:280,w:180,h:180,c:'#4CAF50',n:'MARKET - FOOD'}];
cam={x:0,y:0};joy={x:0,y:0,a:0};J=document.getElementById('joy');S=document.getElementById('stick');
function MSG(q){M=document.getElementById('msg');M.innerText=q;M.style.display='block';setTimeout(()=>M.style.display='none',2000)}
function HJ(e){r=J.getBoundingClientRect();cx=r.left+50;cy=r.top+50;X=(e.touches?e.touches[0].clientX:e.clientX)-cx;Y=(e.touches?e.touches[0].clientY:e.clientY)-cy;d=Math.hypot(X,Y);lim=35;if(d>lim){X=X/d*lim;Y=Y/d*lim}S.style.transform=`translate(${X}px,${Y}px)`;joy.x=X/lim;joy.y=Y/lim}
J.addEventListener('touchstart',e=>{joy.a=1;HJ(e)});J.addEventListener('touchmove',e=>{if(joy.a)HJ(e);e.preventDefault()},{passive:false});addEventListener('touchend',()=>{joy.a=0;joy.x=0;joy.y=0;S.style.transform='translate(0,0)'});J.addEventListener('mousedown',e=>{joy.a=1;HJ(e)});addEventListener('mousemove',e=>{if(joy.a)HJ(e)});addEventListener('mouseup',()=>{joy.a=0;joy.x=0;joy.y=0;S.style.transform='translate(0,0)'});
function WORK(){for(b of blds){if(Math.hypot(pl.x-b.x,pl.y-b.y)<200&&b.n.includes('WORK')){pl.m+=20;MSG('Worked! +$20');return}}MSG('Go to MAMA PUT (brown) to work!')}function EAT(){if(pl.m>=10){pl.m-=10;pl.h=Math.min(100,pl.h+20);MSG('Ate +20 health')}else MSG('Need $10! Work first')}document.getElementById('wb').onclick=WORK;document.getElementById('eb').onclick=EAT;
let tm=360;function LOOP(){pl.x+=joy.x*4;pl.y+=joy.y*4;tm+=0.2;cam.x+=(pl.x-cam.x-innerWidth/2)*0.1;cam.y+=(pl.y-cam.y-innerHeight/2)*0.1;ctx.fillStyle=tm%1440>360&&tm%1440<1080?'#81C784':'#37474F';ctx.fillRect(0,0,cv.width,cv.height);ctx.save();ctx.translate(-cam.x,-cam.y);ctx.fillStyle='#555';ctx.fillRect(-2000,400,4000,100);ctx.fillStyle='#fff';for(i=-2000;i<2000;i+=70)ctx.fillRect(i,445,30,5);for(b of blds){ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#0005';ctx.fillRect(b.x,b.y-22,b.w,22);ctx.fillStyle='#fff';ctx.font='bold 10px Arial';ctx.fillText(b.n,b.x+4,b.y-7)}ctx.fillStyle='#2196F3';ctx.beginPath();ctx.arc(pl.x,pl.y,14,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='16px Arial';ctx.fillText('🧍',pl.x-8,pl.y+5);ctx.restore();document.getElementById('m').innerText=pl.m;document.getElementById('h').innerText=Math.floor(pl.h);hr=Math.floor(tm/60)%24;mn=Math.floor(tm%60);document.getElementById('t').innerText=`${hr%12||12}:${String(mn).padStart(2,'0')}${hr>=12?'PM':'AM'}`;requestAnimationFrame(LOOP)}MSG('Welcome to Aliade! Joystick to move');LOOP();
</script></body></html>
