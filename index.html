<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAGOS LIFE</title><style>body{margin:0;font-family:Arial;background:#050510;color:#fff}#ui{padding:10px;display:flex;justify-content:space-between;background:#111}#locBox{margin:10px;padding:15px;background:#1a2040;border-radius:18px;text-align:center;min-height:250px}#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}button{border:0;padding:12px;border-radius:12px;font-weight:bold;color:#fff}.p{background:#7c5cff}.y{background:#ffb700;color:#000}.pi{background:#ff3b9a}.g{background:#00c06a}.d{background:#222}.b{background:#2196F3}.r{background:#ff3b3b}#log{position:fixed;bottom:10px;left:10px;right:10px;background:#000d;padding:10px;border-radius:10px;display:none;text-align:center}</style></head><body>
<div id="ui"><div>💰 $<span id="m">1100</span><br>🏦 $<span id="bk">0</span><br>💍 <span id="mar">Single</span></div><div>🏠 Lv<span id="lv">0</span> | 🚗 <span id="cr">0</span><br>👶 <span id="kd">0</span></div></div>
<div id="locBox"><div style="font-size:50px" id="hs">🏚️</div><div id="ht"><b>Oshodi - Under Bridge</b></div><div style="font-size:11px;margin-top:10px;opacity:.8">Agbero collect $50 daily! Danfo work +$150. Yahoo +$800 but EFCC fit catch! POS +$80 every 10sec</div><div style="margin-top:10px;font-size:11px">Traffic: <span id="tf">FREE</span> | Energy: <span id="en">100%</span></div></div>
<div id="actions">
<button class="p" onclick="work()">🚌 DANFO WORK</button><button class="b" onclick="yahoo()">💻 YAHOO</button>
<button class="p" onclick="build()">🏗️ BUILD $1k</button><button class="p" onclick="car()">🚘 CAR $2k</button>
<button class="y" onclick="bank()">🏦 BANK</button><button class="r" onclick="agbero()">PAY AGBERO $50</button>
<button class="pi" onclick="marry()">💍 MARRY +30M</button><button class="g" onclick="sleep()">🛏️ SLEEP</button>
<button class="d" onclick="pos()">🏧 POS</button><button class="d" onclick="papers()">📄 PAPERS $1k</button>
</div><div id="log"></div>
<script>
let money=1100,bank=0,lv=0,cars=0,kids=0,en=100,hasPOS=false,hasPap=false,married=false,hC=1000,cC=2000,owe=0;
function L(t){let l=document.getElementById('log');l.innerText=t;l.style.display='block';setTimeout(()=>l.style.display='none',2500)}
function U(){document.getElementById('m').innerText=money;document.getElementById('bk').innerText=bank;document.getElementById('lv').innerText=lv;document.getElementById('cr').innerText=cars;document.getElementById('kd').innerText=kids;document.getElementById('en').innerText=en+'%';document.getElementById('mar').innerText=married?'Married':'Single';document.getElementById('tf').innerText=['FREE','HEAVY','GO-SLOW!'][Math.floor(Math.random()*3)]}
function work(){if(en<=0)return L('No energy! Sleep!');money+=married?300:150;en-=5;L('Danfo +$'+(married?300:150));U()}
function yahoo(){if(Math.random()<0.3){money-=500;L('🚔 EFCC CATCH! -$500')}else{money+=800;L('Yahoo pay +$800')}en-=10;U()}
function build(){if(money>=hC&&lv<5){money-=hC;lv++;hC=Math.floor(hC*2.2);L('Built Lv'+lv)}else L('Need $'+hC);U()}
function car(){if(money>=cC){money-=cC;cars++;cC=Math.floor(cC*1.8);L('Car bought')}else L('Need $'+cC);U()}
function agbero(){if(money>=50){money-=50;owe=0;L('Agbero: Thank you Oga')}else L('No money!');U()}
function papers(){if(money>=1000){money-=1000;hasPap=true;L('Papers bought!')}else L('Need $1k');U()}
function pos(){if(hasPOS)return L('POS already running');if(money>=1000){money-=1000;hasPOS=true;L('POS started +$80/10s');setInterval(()=>{if(hasPOS){money+=80;U()}},10000)}else L('Need $1k');U()}
function bank(){let a=prompt('How much deposit?');a=parseInt(a);if(a>0&&money>=a){money-=a;bank+=a;L('Deposited $'+a)}U()}
function marry(){if(!married){married=true;money+=30000000;kids=1;L('💍 Married! +$30M! +1 kid')}else L('Already married');U()}
function sleep(){if(!married)return L('Marry first!');if(lv==0)return L('Need house!');en=100;money+=1000;if(Math.random()<0.3){kids++;L('👶 New baby! +$1k')}else L('Slept! Energy 100% +$1k');U()}
U();setInterval(()=>{if(bank>0){let i=Math.floor(bank*0.15);bank+=i;L('Bank +$'+i);U()}},30000);
</script></body></html>
